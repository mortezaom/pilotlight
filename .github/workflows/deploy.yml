name: Deploy Pilotlight

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets
        env:
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SETUP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Cloudflare resources
        run: bun scripts/setup.ts

      - name: Build
        run: bun run build

      - name: Apply database migrations
        run: bunx wrangler d1 migrations apply DB --remote

      - name: Prepare secrets
        env:
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          # optional overrides; generated once when absent
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: bash scripts/secrets.sh

      - name: Deploy
        run: |
          bunx wrangler deploy --secrets-file secrets.json
          rm secrets.json
